spec:
  inputs:
    environment:
      type: string
      rules:
        - if: $CI_COMMIT_TAG
          options:
            - "development"
            - "production"
          default: "production"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          options:
            - "development"
            - "production"
          default: "development"
        - default: null

---

stages:
  - build
  - deploy
  - operate


build docker image:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      changes:
        - "Dockerfile"
        - "build/**/*"
        - "**/*.go"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - |
      docker build --progress=plain \
      --cache-from ${CI_REGISTRY_IMAGE} . \
      --build-arg GITLAB_TOKEN="${CI_JOB_TOKEN}" \
      --build-arg GITLAB_HOST="${CI_SERVER_HOST}" \
      --secret id=ci-job-token,env=CI_JOB_TOKEN \
      --tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG} \
      --tag ${CI_REGISTRY_IMAGE}:latest \
      --file ./Dockerfile

    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
    - docker push ${CI_REGISTRY_IMAGE}:latest
  tags:
    - docker


deploy to staging:
  stage: deploy
  environment:
    name: staging
    url: "https://doctyne-staging-01.domsnail.ru"
    action: start
    on_stop: stop staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - job: build docker image
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker compose -f build/compose/docker-compose.dev.yml pull
    - docker compose -f build/compose/docker-compose.dev.yml up -d --wait --remove-orphans
  tags:
    - shell-bf16


deploy to production:
  stage: deploy
  environment:
    name: production
    url: "https://doctyne.domsnail.ru"
    action: start
    on_stop: stop production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker compose -f build/compose/docker-compose.prod.yml pull
    - docker compose -f build/compose/docker-compose.prod.yml up -d --wait --remove-orphans
  tags:
    - shell-bf16


stop staging:
  stage: operate
  environment:
    name: staging
    url: "https://doctyne-staging-01.domsnail.ru"
    action: stop
  when: manual
  script:
    - docker compose -f build/compose/docker-compose.stage.yml stop
  tags:
    - shell-bf16


stop production:
  stage: operate
  environment:
    name: production
    url: "https://doctyne.domsnail.ru"
    action: stop
  when: manual
  script:
    - docker compose -f build/compose/docker-compose.prod.yml stop
  tags:
    - shell-bf16

