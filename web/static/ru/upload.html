<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta5"
        integrity="sha384-5dnhUXCt1hXGvYrjAnKwgNX3I8xtIJiW6eIHIbeo7oWyXv2XpWYC/rl+ZiWfuYO5"
        crossorigin="anonymous">
</script>
<link rel="stylesheet" href="/styles/root.css">
<link rel="stylesheet" href="/styles/components/upload.css">
<head>
    <meta charset="UTF-8">
    <title>Загрузка файла • Doctryne</title>
</head>
<script>
    function onManifestSend() {
        document.getElementById("manifest-upload-btn").disabled = true;
    }
</script>
<body>
<div class="page-content manifest-upload-page">
    <div id="loading" class="htmx-indicator">
        <img src="/assets/rings.svg" alt="loading...">
        <span>Обработка...</span>
    </div>
    <form class="light-border"
          id="manifest-upload-container"
          hx-encoding='multipart/form-data'
          hx-indicator="#loading"
          hx-post='/api/v1/upload'
          hx-swap="none"
          onsubmit="onManifestSend()"
        >
        <label for="manifest-upload">Загрузите файл манифеста:</label>
        <input type="file" id="manifest-upload" name="manifest-file" accept="application/json"/>

        <label for="manifest-type">Тип манифеста</label>
        <select name="manifest-type" id="manifest-type" style="margin-bottom: 1rem">
            <option selected value="cyclonedx.json">cyclonedx.json (1.6+)</option>
            <option value="package.json">package.json</option>
            <option value="go.mod">go.mod</option>
        </select>

        <span title="Искать и выгружать дополнительную информацию о каждом разработчике из сторонних ресурсов (GitHub). В результате будет собрана информация о прочих проектах, организациях и активности каждого разработчика.">
            <label for="extract-full-contibutor-info">Загружать профили разработчиков</label>
            <input type="checkbox" name="extract-full-contibutor-info" id="extract-full-contibutor-info">
        </span>

        <span>
            <label for="extract-full-organization-info">Загружать профили организаций</label>
            <input type="checkbox" name="extract-full-organization-info" id="extract-full-organization-info">
        </span>

        <span>
            <label for="deep-repository-inspection">Глубокий анализ репозиториев</label>
            <input type="checkbox" name="deep-repository-inspection" id="deep-repository-inspection">
        </span>

        <button id="manifest-upload-btn" style="margin-top: 1rem">
            Отправить
        </button>
    </form>
</div>
</body>
</html>
